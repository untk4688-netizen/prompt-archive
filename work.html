<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prompt Archive</title><meta name="build" content="">
<meta property="og:type" content="website"><meta property="og:site_name" content="Prompt Archive"><meta property="og:title" content="Prompt Archive"><meta property="og:description" content="공간 설계 과정에서 AI에게 건넨 프롬프트와 입력 이미지, 그리고 그 결과물을 단계별로 기록한 아카이브입니다."><meta property="og:url" content="https://untk4688-netizen.github.io/prompt-archive/"><meta property="og:image" content="https://untk4688-netizen.github.io/prompt-archive/_img/media/M10_S14_result_01.jpg.w1600.webp"><meta property="og:image:type" content="image/webp"><meta property="og:image:width" content="1600"><meta property="og:image:height" content="1120">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Prompt Archive"><meta name="twitter:description" content="공간 설계 과정에서 AI에게 건넨 프롬프트와 입력 이미지, 그리고 그 결과물을 단계별로 기록한 아카이브입니다."><meta name="twitter:image" content="https://untk4688-netizen.github.io/prompt-archive/_img/media/M10_S14_result_01.jpg.w1600.webp">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"><link rel="stylesheet" href="common.css?v=5"></head>
<body>
<div class="page">
 <div class="bar"><a href="index.html">← Index</a><span id="cat"></span><span id="dt"></span></div>
 <div class="whead"><div class="id" id="wid"></div><h1 id="title"></h1></div>
 <div class="facts" id="facts"></div>
 <div class="idx" id="idxwrap"><div class="lab">Index</div><div class="nums" id="nums"></div></div>
 <div class="panel" id="panel"></div>
</div>
<section class="dark" id="finalsec" hidden><div class="page"><div class="bar"><span>Final</span><span></span><span id="fdt"></span></div><div class="panel" id="final" style="margin-top:24px"></div></div></section>
<footer><div class="page"><p class="note">iPhone: 이미지를 길게 눌러 ‘사진에 저장’을 선택하세요.</p><div class="bar"><span>© 2026 KR</span><span>Prompt Archive</span><a href="index.html">Index ↑</a></div></div></footer>
<script src="common.js?v=5"></script><script>
let DIMS={};
function stepNo(s,i){const t=String(s&&s.title||'');const k=t.indexOf(' · ');return k>-1?t.slice(0,k):pad(i+1);}
function stepName(s){const t=String(s&&s.title||'');const k=t.indexOf(' · ');return k>-1?t.slice(k+3):t;}
function figs(a,cls){return '<div class="gallery '+cls+'">'+a.map(p=>'<figure class="fig">'+img(p,1600,DIMS[p])+'<figcaption><a class="dl" href="'+esc(src(p))+'" download="'+esc(fname(p))+'">이미지 저장 ↓</a></figcaption></figure>').join('')+'</div>';}
function body(o,no,name){o=o||{};const rs=(o.result_images||[]).filter(Boolean),ins=(o.input_images||[]).filter(Boolean);
 let h='<div class="ph"><div class="no">'+esc(no)+'</div><div><div class="t">'+esc(name)+'</div><div class="mm">'+[o.ai,fdate(o.date)].filter(Boolean).map(esc).join(' · ')+'</div></div></div>';
 if(rs.length)h+='<div class="blk"><div class="k">Result</div>'+figs(rs,'res')+'</div>';
 if(ins.length)h+='<div class="blk"><div class="k">Input</div>'+figs(ins,'inp')+'</div>';
 if(o.prompt)h+='<div class="blk"><div class="k kp"><span>Prompt</span><button class="copy">프롬프트 복사</button></div><div><pre class="prompt"></pre><button class="more" hidden>전체 보기</button></div></div>';
 return h;}
function fill(el,o){el.querySelectorAll('pre.prompt').forEach(p=>{p.textContent=o.prompt||'';chainScroll(p);const m=p.nextElementSibling;if(m&&m.classList.contains('more'))promptToggle(p,m);});const b=el.querySelector('.copy');if(b)b.onclick=()=>copyText(o.prompt||'',b);}
// 3글자 이상 단계 번호만 160px 칸에 맞게 글자 크기 축소 (두 글자 번호는 그대로)
function fitNo(el){const n=el.querySelector('.ph .no');if(!n)return;n.style.fontSize='';if(n.textContent.length<3)return;
 const cw=n.clientWidth,sw=n.scrollWidth;if(sw>cw)n.style.fontSize=Math.floor(parseFloat(getComputedStyle(n).fontSize)*cw/sw)+'px';}
loadWork(new URLSearchParams(location.search).get('id')).then(({work:w,dims})=>{DIMS=dims||{};
 if(!w){document.getElementById('title').textContent='찾을 수 없음';return;}
 const [tid,name]=splitTitle(w.title,w.id);document.title=(w.id||'')+' · '+name+' — Prompt Archive';
 document.getElementById('wid').textContent=w.id||tid;document.getElementById('title').textContent=catLabel(name||w.title);
 document.getElementById('cat').textContent=(CAT_EN[w.category]||w.category||'')+' · '+(w.category||'');document.getElementById('dt').textContent=fdate(w.date);
 const steps=(w.steps||[]).filter(Boolean);
 const ais=[...new Set(steps.map(s=>s.ai).concat(w.final&&w.final.ai||[]).filter(a=>a&&!String(a).startsWith('실행불가')))];
 document.getElementById('facts').innerHTML=[['Category',w.category],['Date',fdate(w.date)],['Steps',steps.length],['AI',ais.join(', ')],['Source',w.source]].filter(x=>x[1]!==undefined&&x[1]!=='').map(x=>'<div><b>'+x[0]+'</b>'+esc(x[1])+'</div>').join('');
 const nums=document.getElementById('nums'),panel=document.getElementById('panel');
 if(!steps.length){document.getElementById('idxwrap').hidden=true;}
 nums.innerHTML=steps.map((s,i)=>'<button class="num" data-i="'+i+'"><span class="no">'+esc(stepNo(s,i))+'</span><span class="tt">'+esc(stepName(s))+'</span></button>').join('');
 // 패널 아래 이전/다음 단계 (바 글자 스타일). 첫·마지막 단계에서는 해당 쪽을 비운다
 function pn(i){const a=k=>'<a href="#s'+encodeURIComponent(stepNo(steps[k],k))+'" data-i="'+k+'">';
  return '<div class="bar pn">'+(i>0?a(i-1)+'← '+esc(stepNo(steps[i-1],i-1))+'</a>':'<span></span>')+'<span></span>'+(i<steps.length-1?a(i+1)+esc(stepNo(steps[i+1],i+1))+' →</a>':'<span></span>')+'</div>';}
 // 선택한 단계를 주소에 남김 (#s<번호>, 뒤로가기 기록은 쌓지 않음)
 function show(i,scroll,mark){nums.querySelectorAll('.num').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));const s=steps[i];panel.innerHTML=body(s,stepNo(s,i),stepName(s))+pn(i);fill(panel,s);fitNo(panel);
  if(mark)history.replaceState(null,'','#s'+encodeURIComponent(stepNo(s,i)));
  if(scroll)panel.scrollIntoView({behavior:scroll==='jump'?'instant':'smooth',block:'start'});}
 function hashIdx(){const m=/^#s(.+)$/.exec(location.hash);if(!m)return -1;let v=m[1];try{v=decodeURIComponent(v);}catch(e){}return steps.findIndex((s,i)=>stepNo(s,i)===v);}
 nums.onclick=e=>{const b=e.target.closest('.num');if(b)show(+b.dataset.i,true,true);};
 panel.addEventListener('click',e=>{const a=e.target.closest('.pn a');if(a){e.preventDefault();show(+a.dataset.i,true,true);}});
 addEventListener('hashchange',()=>{const k=hashIdx();if(k>-1)show(k,true,false);});
 addEventListener('resize',()=>fitNo(panel));
 if(steps.length){const k=hashIdx();show(k>-1?k:0,false,false);
  const fit=()=>{fitNo(panel);if(k>-1)panel.scrollIntoView({behavior:'instant',block:'start'});};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);else fit();}
 const f=w.final||{};const fr=(f.result_images||[]).filter(Boolean);
 if(fr.length||f.prompt){const sec=document.getElementById('finalsec');sec.hidden=false;document.getElementById('fdt').textContent=fdate(f.date);const el=document.getElementById('final');el.innerHTML=body(f,'Final',f.title&&f.title!=='최종'?stepName(f):'최종 결과물');fill(el,f);}
}).catch(()=>{document.getElementById('title').textContent='불러오지 못했습니다';});
</script></body></html>
